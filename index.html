<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack - Casino Royale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient particles -->
  <div class="particles" id="particles"></div>

  <div class="casino-frame">
    <!-- Top neon sign -->
    <div class="neon-sign">
      <span class="neon-text">BLACKJACK</span>
      <span class="neon-sub">Casino Royale</span>
    </div>

    <!-- Felt table -->
    <div class="table">
      <div class="table-edge top"></div>
      <div class="table-felt">

        <!-- Chip tray / info bar -->
        <div class="info-bar">
          <div class="chip-stack balance-display">
            <div class="chip chip-gold"></div>
            <span class="balance-text">$<span id="balance">1000</span></span>
          </div>
          <div class="bet-controls">
            <button class="chip-btn" onclick="adjustBet(-25)">-25</button>
            <button class="chip-btn" onclick="adjustBet(-5)">-5</button>
            <div class="bet-display">
              <div class="bet-chip"></div>
              <span>$<span id="bet-display">10</span></span>
              <input type="hidden" id="bet-input" value="10">
            </div>
            <button class="chip-btn" onclick="adjustBet(5)">+5</button>
            <button class="chip-btn" onclick="adjustBet(25)">+25</button>
          </div>
        </div>

        <!-- Dealer area -->
        <div class="hand-area dealer-area">
          <div class="hand-label">
            <span class="label-icon">&#9824;</span>
            DEALER
            <span class="score-badge" id="dealer-score"></span>
          </div>
          <div id="dealer-cards" class="cards"></div>
        </div>

        <!-- Divider -->
        <div class="table-divider">
          <div class="divider-line"></div>
          <div id="message" class="message"></div>
          <div class="divider-line"></div>
        </div>

        <!-- Player area -->
        <div class="hand-area player-area">
          <div id="player-cards" class="cards"></div>
          <div class="hand-label">
            <span class="label-icon">&#9827;</span>
            YOU
            <span class="score-badge" id="player-score"></span>
          </div>
        </div>

      </div>
      <div class="table-edge bottom"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="btn-deal" class="btn btn-deal" onclick="startGame()">
        <span class="btn-icon">&#127183;</span> DEAL
      </button>
      <button id="btn-hit" class="btn btn-hit" onclick="hit()" disabled>
        <span class="btn-icon">&#9654;</span> HIT
      </button>
      <button id="btn-stand" class="btn btn-stand" onclick="stand()" disabled>
        <span class="btn-icon">&#9632;</span> STAND
      </button>
      <button id="btn-double" class="btn btn-double" onclick="doubleDown()" disabled>
        <span class="btn-icon">&#215;2</span> DOUBLE
      </button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
