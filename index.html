<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="table">
    <h1>Blackjack</h1>

    <div class="info-bar">
      <div class="balance">Balance: $<span id="balance">1000</span></div>
      <div class="bet-area">
        <label>Bet: $</label>
        <input type="number" id="bet-input" value="10" min="1" max="1000" step="5">
      </div>
    </div>

    <div class="hand dealer-hand">
      <h2>Dealer <span id="dealer-score"></span></h2>
      <div id="dealer-cards" class="cards"></div>
    </div>

    <div class="hand player-hand">
      <h2>You <span id="player-score"></span></h2>
      <div id="player-cards" class="cards"></div>
    </div>

    <div id="message" class="message"></div>

    <div class="controls">
      <button id="btn-deal" onclick="startGame()">Deal</button>
      <button id="btn-hit" onclick="hit()" disabled>Hit</button>
      <button id="btn-stand" onclick="stand()" disabled>Stand</button>
      <button id="btn-double" onclick="doubleDown()" disabled>Double</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
